name: Node.js test

on: [pull_request]

permissions:
  contents: read

jobs:
  test:
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Jest + typecheck
        run: npx jest && npm run typecheck

      - name: Playwright — compare against committed baselines
        id: compare
        continue-on-error: true
        run: npx playwright test --output=test-results

      - name: Regenerate failing screenshots
        id: regen
        if: steps.compare.outcome == 'failure'
        continue-on-error: true
        run: npx playwright test --output=test-results --last-failed --update-snapshots

      # Runs even if an earlier step failed: the marker is what tells the
      # comment workflow (and post-merge sync) which baselines moved, so it must
      # be produced whatever else goes wrong in this job.
      - name: Detect changed baselines vs base branch
        id: changed
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/changed-baselines"
          if [ -z "$BASE_SHA" ]; then
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          git add -N src/assets/visual-snapshots/ || true
          git diff --name-only "$BASE_SHA" -- src/assets/visual-snapshots/ | sort \
            > "$RUNNER_TEMP/changed-baselines/changed.txt"
          if [ -s "$RUNNER_TEMP/changed-baselines/changed.txt" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail — screenshot failures could not be regenerated
        if: steps.compare.outcome == 'failure' && steps.regen.outcome != 'success'
        run: exit 1

      - name: Upload the changed baseline list for the comment workflow
        if: always() && steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: changed-baselines
          path: ${{ runner.temp }}/changed-baselines/changed.txt
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload Playwright report on failure (or after a regen)
        if: failure() || steps.compare.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore
