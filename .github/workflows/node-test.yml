name: Node.js test

# Runs untrusted fork code (npm ci, jest, playwright), so it must use
# `pull_request`: the token stays read-only and no base-repo secrets are
# reachable. The PR comment needs write rights, so it is handed off to
# baseline-change-comment.yml (workflow_run), which never checks out PR code.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Jest + typecheck
        run: npx jest && npm run typecheck

      - name: Playwright — compare against committed baselines
        id: compare
        continue-on-error: true
        run: npx playwright test --output=test-results

      - name: Regenerate failing screenshots
        id: regen
        if: steps.compare.outcome == 'failure'
        continue-on-error: true
        run: npx playwright test --output=test-results --last-failed --update-snapshots

      - name: Detect changed baselines vs base branch
        id: changed
        if: steps.compare.outcome != 'skipped'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGED_LIST_FILE: ${{ runner.temp }}/changed-baselines.txt
        run: |
          set -uo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          : > "$CHANGED_LIST_FILE"
          if [ -z "$BASE_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          git add -N src/assets/visual-snapshots/ || true
          CHANGED="$(git diff --name-only "$BASE_SHA" -- src/assets/visual-snapshots/ | sort)"
          if [ -n "$CHANGED" ]; then
            printf '%s\n' "$CHANGED" > "$CHANGED_LIST_FILE"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage baseline-change payload for the commenter workflow
        if: always() && steps.changed.outcome == 'success'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_LIST_FILE: ${{ runner.temp }}/changed-baselines.txt
          PAYLOAD_DIR: ${{ runner.temp }}/baseline-changes
        run: |
          set -uo pipefail
          mkdir -p "$PAYLOAD_DIR"
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const listFile = process.env.CHANGED_LIST_FILE;
            const changed = fs.existsSync(listFile)
              ? fs
                  .readFileSync(listFile, "utf8")
                  .split("\n")
                  .map((line) => line.trim())
                  .filter(Boolean)
              : [];
            fs.writeFileSync(
              process.env.PAYLOAD_DIR + "/changes.json",
              JSON.stringify(
                {
                  schema: 1,
                  runId: process.env.GITHUB_RUN_ID,
                  headSha: process.env.HEAD_SHA,
                  changed,
                },
                null,
                2
              ) + "\n"
            );
          '

      - name: Upload baseline-change payload
        if: always() && steps.changed.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: baseline-changes
          path: ${{ runner.temp }}/baseline-changes/changes.json
          retention-days: 7
          if-no-files-found: error

      - name: Fail — screenshot failures could not be regenerated
        if: steps.compare.outcome == 'failure' && steps.regen.outcome != 'success'
        run: exit 1

      - name: Upload Playwright report on failure (or after a regen)
        if: failure() || steps.compare.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore
