name: Comment repro input

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  comment-repro:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Decode the transformer input
        id: decode
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          RESULT_FILE: ${{ runner.temp }}/comment-repro-result.json
        run: node scripts/comment-repro-input.mjs

      - name: Comment and label the decoded input
        uses: actions/github-script@v7
        env:
          RESULT_FILE: ${{ runner.temp }}/comment-repro-result.json
        with:
          script: |
            const fs = require("node:fs");
            const result = JSON.parse(
              fs.readFileSync(process.env.RESULT_FILE, "utf8")
            );
            if (!result.found) {
              console.log(
                "No transformers URL with a code= param in the issue body — skipping."
              );
              return;
            }
            const lines = [
              "Automated reproduction info (decoded with the current transformer code at issue-open time):",
              "",
            ];
            if (result.failed) {
              lines.push(
                "The compressed code in this issue could not be decoded with the current codebase."
              );
            } else {
              if (result.step) {
                lines.push(
                  `Step ${result.step} (expanded output, default settings):`,
                  "",
                  "```haskell",
                  result.expanded,
                  "```",
                  ""
                );
              } else {
                lines.push(
                  "Expanded output (default settings):",
                  "",
                  "```haskell",
                  result.expanded,
                  "```",
                  ""
                );
              }
              lines.push("Transformer input:", "", "```haskell", result.input, "```");
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join("\n"),
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ["bug", "bug/internal-error"],
            });
            console.log(
              `Commented decoded transformer input and added labels on issue #${context.issue.number}.`
            );
