name: Coverage

on:
  pull_request:
  push:
    branches: ["*/main", "*/development"]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to re-measure"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: write
  statuses: write

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the commit under test
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr) || github.event.pull_request.head.sha || '' }}

      - name: Use Node.js 20.19.5
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve the commit and branch under test
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr || '' }}
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "branch=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.ref')" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "branch=${GITHUB_HEAD_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Jest with coverage
        run: npx jest --coverage

      - name: Upload coverage to Coveralls
        id: coveralls
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./coverage/lcov.info
          git-commit: ${{ steps.target.outputs.sha }}
          git-branch: ${{ steps.target.outputs.branch }}

      - name: Record the coverage result
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr || '' }}
          COMMIT_SHA: ${{ steps.target.outputs.sha }}
          BRANCH: ${{ steps.target.outputs.branch }}
          COVERALLS_OUTCOME: ${{ steps.coveralls.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/coverage-result"
          node - "${RUNNER_TEMP}/coverage-result/result.json" <<'NODE'
          const fs = require("node:fs");
          const [out] = process.argv.slice(2);
          let total = null;
          try {
            const summary = JSON.parse(
              fs.readFileSync("coverage/coverage-summary.json", "utf8")
            );
            total = summary.total?.lines?.pct ?? null;
          } catch {
            // Coverage is unavailable when the suite failed before writing it.
          }
          const pr = Number.parseInt(process.env.PR_NUMBER ?? "", 10);
          fs.writeFileSync(
            out,
            JSON.stringify(
              {
                pr: Number.isInteger(pr) && pr > 0 ? pr : null,
                sha: process.env.COMMIT_SHA || null,
                branch: process.env.BRANCH || null,
                total,
                coveralls: process.env.COVERALLS_OUTCOME || "skipped",
                runUrl: process.env.RUN_URL,
              },
              null,
              2
            )
          );
          NODE

      - name: Upload the coverage result for the comment workflow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-result
          path: ${{ runner.temp }}/coverage-result/result.json
          retention-days: 7
          if-no-files-found: ignore
