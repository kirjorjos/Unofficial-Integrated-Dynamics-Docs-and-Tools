name: Bug report
description: Report something broken, incorrect, or missing
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >
        Thanks for taking the time to file a bug! Please fill out the sections
        below so the issue can be reproduced and triaged quickly.

  - type: checkboxes
    id: area
    attributes:
      label: Affected area
      description: Where does the problem show up?
      options:
        - label: Logic Programmer View
        - label: Display Panel View
        - label: Reader View
        - label: Visual Transformer
        - label: JSON Transformer
        - label: Code Line Transformer
        - label: Expanded Transformer
        - label: Condensed Transformer
        - label: Multiple Transformers (Please select problematic ones)
        - label: Operator Documentation
        - label: Reader Documentation
        - label: GitHub Actions / CI
        - label: Local workflows
        - label: Other

  - type: textarea
    id: whats-wrong
    attributes:
      label: What's wrong?
      description: A clear description of what went wrong, including what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps or a link that shows the problem.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
