name: Suggestion
description: Propose an improvement, new page, or feature
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >
        Thanks for the idea! Tell us what you would like to see and why it
        would help.

  - type: checkboxes
    id: area
    attributes:
      label: Affected area
      description: What part of the project does this touch?
      options:
        - label: Logic Programmer View
        - label: Display Panel View
        - label: Reader View
        - label: Visual Transformer
        - label: JSON Transformer
        - label: Code Line Transformer
        - label: Expanded Transformer
        - label: Condensed Transformer
        - label: Multiple Transformers (Please select problematic ones)
        - label: Operator Documentation
        - label: Reader Documentation
        - label: GitHub Actions / CI
        - label: Local workflows
        - label: Other

  - type: textarea
    id: suggestion
    attributes:
      label: Describe the suggestion
      description: What should change or be added?
    validations:
      required: true

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else you think should be known?
      description: Additional context that could be useful when implementing this.
