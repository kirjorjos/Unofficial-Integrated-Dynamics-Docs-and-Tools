name: Suggestion
description: Propose an improvement, new page, or feature
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >
        Thanks for the idea! Tell us what you would like to see and why it
        would help.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: What part of the project does this touch?
      multiple: true
      options:
        - Logic Programmer View
        - Display Panel View
        - Reader View
        - Visual Transformer
        - JSON Transformer
        - Code Line Transformer
        - Expanded Transformer
        - Condensed Transformer
        - Multiple Transformers (Please select problematic ones)
        - Operator Documentation
        - Reader Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Describe the suggestion
      description: What should change or be added?
    validations:
      required: true

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else you think should be known?
      description: Additional context that could be useful when implementing this.
